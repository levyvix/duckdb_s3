[project]
name = "dagster_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
    "boto3>=1.37.38",
    "dagster",
    "dagster-cloud",
    "dagster-webserver>=1.8.12",
    "duckdb>=1.3.2",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver", 
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "dagster_project.definitions"
code_location_name = "dagster_project"
